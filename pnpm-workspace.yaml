packages:
  - 'packages/**'
  - 'apps/**'
  # ubean writes a runtime package.json into `dist/server`; keep build output out of the workspace.
  - '!apps/**/dist/**'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.b310e71f11353a85781d2d0e0e0bfe149e0f55a2
  vite-plus: 0.0.0-commit.b310e71f11353a85781d2d0e0e0bfe149e0f55a2
  typescript: npm:typescript-native-bridge@latest
  vitest: 5.1.0
  '@vitest/browser-playwright': 5.1.0
overrides:
  typescript: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
allowBuilds:
  esbuild: false
  maplibre-gl: false
  vue-demi: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
